gesture_to_cmd_vel_node:
  ros__parameters:
    use_stamped: true          # TurtleBot3 on Jazzy expects geometry_msgs/TwistStamped
    frame_id: base_link
    publish_rate_hz: 20.0
    deadman_timeout_s: 0.5     # zero velocity if no /gesture within this window
    min_confidence: 0.8
    max_linear: 0.22           # TurtleBot3 burger limits
    max_angular: 2.84
    linear_accel: 0.5          # m/s^2 ramp limit
    angular_accel: 3.0         # rad/s^2 ramp limit
    # label -> [linear.x, angular.z]
    gestures:
      open_palm: [0.0, 0.0]
      fist: [0.0, 0.0]
      pointing_up: [0.15, 0.0]
      victory: [0.0, 0.6]
      thumb_up: [0.0, -0.6]
      thumb_down: [-0.10, 0.0]
